<div class="user-list-container">
  <div class="header">
    <h2>Пользователи</h2>
    <button nz-button nzType="primary" routerLink="/users/new">
      <i nz-icon nzType="plus"></i> Создать пользователя
    </button>
  </div>

  <div class="filters">
    <nz-input-group [nzPrefix]="searchIcon">
      <input nz-input placeholder="Поиск по имени или email" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />
    </nz-input-group>
    <ng-template #searchIcon><i nz-icon nzType="search"></i></ng-template>
  </div>

  <nz-table #basicTable [nzData]="paginatedUsers" [nzLoading]="loading" nzBordered>
    <thead>
      <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Телефон</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of basicTable.data">
        <td>{{ user.id }}</td>
        <td><a [routerLink]="['/users', user.id]">{{ user.name }}</a></td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>
          <button nz-button nzType="link" [routerLink]="['/users', user.id, 'edit']">
            <i nz-icon nzType="edit"></i>
          </button>
          <button nz-button nzType="link" nzDanger (click)="deleteUser(user.id!)">
            <i nz-icon nzType="delete"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>

  <nz-pagination
    [nzPageIndex]="pageIndex"
    [nzPageSize]="pageSize"
    [nzTotal]="total"
    (nzPageIndexChange)="pageIndex = $event"
    (nzPageSizeChange)="pageSize = $event; pageIndex = 1"
    nzShowSizeChanger>
  </nz-pagination>
</div>
